<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 - Not Found</title>
  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .box {
      padding: 40px;
      border: 1px solid #222;
      background: #050505;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 20px;
    }

    a {
      color: #fff;
      text-decoration: underline;
    }

    .code {
      color: #555;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Page not found.</p>
    <a href="index.html">Return Home</a>
    <div class="code">requested resource does not exist</div>
  </div>
</body>
</html>
