<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Documentation | Flipper Zero Downloads</title>

<meta name="description"
content="Official documentation for Flipper Zero Downloads.">

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>

<body>

<header>

<nav>

<a href="index.html" class="logo">

Flipper<span> Zero Downloads</span>

</a>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="documentation.html" class="active">Documentation</a></li>

<li><a href="about.html">About</a></li>

<li><a href="faq.html">FAQ</a></li>

<li><a href="contributing.html">Contributing</a></li>

</ul>

</nav>

</header>

<div class="docs-layout">

<aside class="docs-sidebar">

<div class="sidebar-header">

<h2>

Documentation

</h2>

<p>

Main Branch

</p>

</div>

<div class="sidebar-search">

<input
type="text"
id="docSearch"
placeholder="Search documentation...">

</div>

<nav id="sidebarNav">

<!-- Generated by script.js -->

</nav>

</aside>

<main class="docs-main">

<div class="docs-banner">

<img
id="docBanner"
src="assets/banners/default.png"
alt="Documentation Banner">

</div>

<div class="docs-header">

<div>

<h1 id="docTitle">

Loading...

</h1>

<p id="docDescription">

Loading documentation...

</p>

</div>

<div class="docs-actions">

<a
id="githubButton"
class="btn btn-secondary"
target="_blank">

View on GitHub

</a>

</div>

</div>

<div class="progress-container">

<div id="readingProgress"></div>

</div>

<div class="documentation-wrapper">

<div class="documentation-content">

<div id="viewer">

<div class="loading">

<h2>

Loading Documentation...

</h2>

<p>

Downloading Markdown from the main branch.

</p>

</div>

</div>

</div>

<aside class="table-of-contents">

<h3>

On This Page

</h3>

<div id="toc">

<p>

Select a document.

</p>

</div>

</aside>

</div>
</aside>

</div>

</main>

</div>

<script>

const REPO_OWNER = "SYOP200";
const REPO_NAME = "Flipper-Zero-Downloads";

const RAW_BASE =
`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/Documentation/`;

const REPO_BASE =
`https://github.com/${REPO_OWNER}/${REPO_NAME}/blob/main/Documentation/`;

const DOCUMENTS = [

{
title:"Overview",
file:"overview.md",
banner:"assets/banners/overview.png",
description:"Repository overview and introduction."
},

{
title:"README",
file:"README.md",
banner:"assets/banners/readme.png",
description:"Project README."
},

{
title:"Firmware",
file:"firmware.md",
banner:"assets/banners/firmware.png",
description:"Firmware documentation."
},

{
title:"Applications",
file:"apps.md",
banner:"assets/banners/apps.png",
description:"Applications documentation."
},

{
title:"GPIO",
file:"gpio.md",
banner:"assets/banners/gpio.png",
description:"GPIO documentation."
},

{
title:"Infrared",
file:"infrared.md",
banner:"assets/banners/infrared.png",
description:"Infrared documentation."
},

{
title:"NFC",
file:"nfc.md",
banner:"assets/banners/nfc.png",
description:"NFC documentation."
},

{
title:"RFID",
file:"rfid.md",
banner:"assets/banners/rfid.png",
description:"RFID documentation."
},

{
title:"Sub-GHz",
file:"subghz.md",
banner:"assets/banners/subghz.png",
description:"Sub-GHz documentation."
},

{
title:"BadUSB",
file:"badusb.md",
banner:"assets/banners/badusb.png",
description:"BadUSB documentation."
},

{
title:"Scripts",
file:"scripts.md",
banner:"assets/banners/scripts.png",
description:"Scripts documentation."
},

{
title:"Graphics",
file:"graphics.md",
banner:"assets/banners/graphics.png",
description:"Graphics documentation."
},

{
title:"Picopass",
file:"picopass.md",
banner:"assets/banners/picopass.png",
description:"Picopass documentation."
},

{
title:"UniRF",
file:"unirf.md",
banner:"assets/banners/unirf.png",
description:"UniRF documentation."
},

{
title:"3D Printing",
file:"3D-Printing.md",
banner:"assets/banners/3d-printing.png",
description:"3D printable accessories."
},

{
title:"Playlists",
file:"playlists.md",
banner:"assets/banners/playlists.png",
description:"Community playlists."
}

];

const sidebar =
document.getElementById("sidebarNav");

const viewer =
document.getElementById("viewer");

const banner =
document.getElementById("docBanner");

const title =
document.getElementById("docTitle");

const description =
document.getElementById("docDescription");

const github =
document.getElementById("githubButton");

const search =
document.getElementById("docSearch");

const toc =
document.getElementById("toc");

const cache = {};

function buildSidebar(){

sidebar.innerHTML="";

DOCUMENTS.forEach(doc=>{

const button=document.createElement("button");

button.className="sidebar-item";

button.dataset.file=doc.file;

button.innerHTML=`

<span>

${doc.title}

</span>

`;

button.onclick=()=>{

loadDocument(doc.file);

};

sidebar.appendChild(button);

});

}

buildSidebar();

search.addEventListener("input",()=>{

const value=

search.value.toLowerCase();

document

.querySelectorAll(".sidebar-item")

.forEach(button=>{

button.style.display=

button.innerText

.toLowerCase()

.includes(value)

?

"flex"

:

"none";

});

});

async function loadDocument(file){

const doc=

DOCUMENTS.find(

d=>d.file===file

);

document

.querySelectorAll(".sidebar-item")

.forEach(item=>{

item.classList.remove("active");

if(item.dataset.file===file){

item.classList.add("active");

}

});

title.textContent=

doc.title;

description.textContent=

doc.description;

banner.src=

doc.banner;

github.href=

REPO_BASE+file;

viewer.innerHTML=`

<div class="loading">

<h2>

Loading...

</h2>

</div>

`;

try{

if(cache[file]){

viewer.innerHTML=

marked.parse(cache[file]);

generateTOC();

return;

}

const response=

await fetch(

RAW_BASE+file

);

if(!response.ok)

throw new Error();

const markdown=

await response.text();

cache[file]=markdown;

viewer.innerHTML=

marked.parse(markdown);

generateTOC();

}

catch{

viewer.innerHTML=`

<h2>

Unable to load

${file}

</h2>

<p>

The Markdown file could not be downloaded.

</p>

`;

}

}

loadDocument(

DOCUMENTS[0].file

);
function generateTOC(){

toc.innerHTML="";

const headings=

viewer.querySelectorAll(

"h1,h2,h3"

);

if(!headings.length){

toc.innerHTML="<p>No headings.</p>";

return;

}

headings.forEach((heading,index)=>{

const id=

"heading-"+index;

heading.id=id;

const link=

document.createElement("a");

link.href="#"+id;

link.className="toc-link";

link.textContent=

heading.innerText;

link.onclick=(event)=>{

event.preventDefault();

document

.getElementById(id)

.scrollIntoView({

behavior:"smooth",

block:"start"

});

};

toc.appendChild(link);

});

}

const progress=

document.getElementById(

"readingProgress"

);

window.addEventListener(

"scroll",

()=>{

const article=

viewer;

const height=

article.scrollHeight-

article.clientHeight;

const percent=

Math.min(

100,

(article.scrollTop/height)*100

);

progress.style.width=

percent+"%";

}

);

viewer.addEventListener(

"scroll",

()=>{

const article=

viewer;

const height=

article.scrollHeight-

article.clientHeight;

const percent=

Math.min(

100,

(article.scrollTop/height)*100

);

progress.style.width=

percent+"%";

}

);

function addCopyButtons(){

viewer

.querySelectorAll("pre")

.forEach(block=>{

const button=

document.createElement(

"button"

);

button.className=

"copy-button";

button.innerText=

"Copy";

button.onclick=()=>{

navigator.clipboard.writeText(

block.innerText

);

button.innerText=

"Copied!";

setTimeout(()=>{

button.innerText=

"Copy";

},1500);

};

block.style.position=

"relative";

block.appendChild(button);

});

}

const oldLoad=

loadDocument;

loadDocument=

async function(file){

await oldLoad(file);

generateTOC();

addCopyButtons();

};

document.addEventListener(

"keydown",

event=>{

if(event.key==="/"){

event.preventDefault();

search.focus();

}

});

document.addEventListener(

"keydown",

event=>{

const active=

document.querySelector(

".sidebar-item.active"

);

if(!active)return;

const current=

DOCUMENTS.findIndex(

d=>d.file===

active.dataset.file

);

if(

event.key==="ArrowDown"

&&

current<DOCUMENTS.length-1

){

loadDocument(

DOCUMENTS[current+1].file

);

}

if(

event.key==="ArrowUp"

&&

current>0

){

loadDocument(

DOCUMENTS[current-1].file

);

}

});

window.addEventListener(

"load",

()=>{

loadDocument(

DOCUMENTS[0].file

);

});

</script>

<script src="script.js"></script>

</body>

</html>
